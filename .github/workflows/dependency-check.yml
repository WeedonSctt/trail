name: Dependency Audit

on:
  schedule:
    - cron: "0 4 * * 1"
  # Allow the audit to be run on demand, so a dependency fix can be verified
  # immediately instead of waiting for the next Monday cron tick.
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # --locked: build cargo-audit against its own committed lockfile so a
      # freshly-published transitive dependency cannot break the audit job
      # itself.
      - run: cargo install cargo-audit --locked

      - run: cargo audit
