# Trail default configuration.

[general]
editor = "nvim"
# Shell that runs `!<command>` and `:git`: a program, then the flags that make
# it read a command string as one argument.  Empty keeps the platform default
# -- `cmd.exe /C` on Windows, `sh -c` elsewhere -- which is what Trail has
# always used, so leaving this alone changes nothing.
#
# Set it to pick a different interpreter, e.g. `pwsh -NoProfile -Command` on
# Windows so that `./program` and other POSIX-ish spellings resolve (cmd.exe
# reads a leading `/` as a switch and fails on `./program`), or `bash -c` to
# get bash syntax instead of whatever `sh` is on this system.  The trade-off is
# startup cost per command -- pwsh is markedly slower to launch than cmd.exe,
# and `-NoProfile` is what keeps that from getting worse -- and that shell
# builtins stop matching the ones your muscle memory expects.
#
# Whitespace separates tokens; double-quote a program path containing spaces.
# Windows paths need a TOML literal string, e.g.
# shell = '"C:\Program Files\PowerShell\7\pwsh.exe" -NoProfile -Command'
shell = ""
# Whether to wait for Enter after a `!<command>` or `:git` finishes, before
# Trail takes the screen back: always | on_error | never.
#
# A command's output is printed on the normal screen, which Trail covers again
# the moment the command exits -- so without a pause, `!ls` paints its output and
# erases it in the same breath.  The trade-off is a keystroke per command: set
# `on_error` to be held up only when something failed, or `never` if you run
# commands for their effect rather than their output and would rather read them
# in the log.  Opening a file in the editor never pauses whatever this says --
# an editor owns the screen while it runs and leaves nothing behind to read.
shell_pause = "always"
text_sync_threshold_kb = 256
git_status_enabled = true
fs_watch_debounce_ms = 200

[preview]
# Inline-image protocol: auto | kitty | iterm2 | sixel | halfblocks | none
image_protocol = "auto"
# Terminal character cell size in pixels.  0 detects it where the platform will
# say (never on Windows) and otherwise assumes a deliberately small default, so
# that an image errs towards leaving a margin rather than overflowing the pane
# and being dropped by the terminal.  Set a real measurement to fill the pane
# exactly: lower these if images overflow, raise them if images look too small.
image_cell_width = 0
image_cell_height = 0
# How many lines of a text file the preview loads.  The preview scrolls within
# this window (J/K, Shift-arrows, Ctrl-f/Ctrl-b) and its footer marks a file
# that continues past it with a "+".  Raising this lets you scroll further into
# long files, at proportionally more worker time and memory per preview; the
# accepted range is 1 to 100000.
max_lines = 2000

[theme]
foreground = "white"
background = "black"
border = "dark_gray"
selection_fg = "black"
selection_bg = "dark_gray"
directory = "blue"
symlink = "cyan"
hidden = "dark_gray"
status_fg = "dark_gray"
error = "red"
search = "yellow"
command = "cyan"
git_clean = "green"
git_dirty = "yellow"

[keymap.navigation]
move_down = "j"
move_up = "k"
jump_bottom = "G"
jump_top = "gg"
enter_or_open = "l"
go_parent = "h"
history_back = "u"
history_forward = "ctrl-r"
refresh = "R"
toggle_hidden = "."
copy_absolute_path = "ya"
copy_relative_path = "yr"
copy_filename = "yn"
copy_content = "yc"
delete = "dd"
enter_search = "/"
enter_command = ":"
quit = "q"
open_with_os = "o"
new_tab = "ctrl-t"
close_tab = "ctrl-w"
switch_tab_next = "tab"
switch_tab_prev = "shift-tab"
# Preview pane scrolling.  Shift-down and Shift-up are built-in aliases for the
# first two, the same way the plain arrows alias move_down/move_up.
preview_scroll_down = "J"
preview_scroll_up = "K"
preview_page_down = "ctrl-f"
preview_page_up = "ctrl-b"
preview_scroll_top = "shift-home"
preview_scroll_bottom = "shift-end"

[keymap.search]
# Search Mode is a typing mode: unmodified characters go into the query, so
# these must be named or modified keys.  Binding a bare letter here is a
# config error -- it would make that letter impossible to search for.
# Ctrl-n / Ctrl-p / Ctrl-h also work as built-in aliases.
exit = "esc"
confirm = "enter"
move_down = "down"
move_up = "up"
delete_char = "backspace"

[plugins]
enabled = []
