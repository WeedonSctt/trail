# Trail default configuration.

[general]
editor = "nvim"
text_sync_threshold_kb = 256
git_status_enabled = true
fs_watch_debounce_ms = 200

[theme]
foreground = "white"
background = "black"
border = "dark_gray"
selection_fg = "black"
selection_bg = "dark_gray"
directory = "blue"
symlink = "cyan"
hidden = "dark_gray"
status_fg = "dark_gray"
error = "red"
search = "yellow"
command = "cyan"
git_clean = "green"
git_dirty = "yellow"

[keymap.navigation]
move_down = "j"
move_up = "k"
jump_bottom = "G"
jump_top = "gg"
enter_or_open = "l"
go_parent = "h"
history_back = "u"
history_forward = "ctrl-r"
refresh = "R"
toggle_hidden = "."
copy_absolute_path = "ya"
copy_relative_path = "yr"
copy_filename = "yn"
copy_content = "yc"
delete = "dd"
enter_search = "/"
enter_command = ":"
quit = "q"
open_with_os = "o"
new_tab = "ctrl-t"
close_tab = "ctrl-w"
switch_tab_next = "tab"
switch_tab_prev = "shift-tab"

[keymap.search]
exit = "esc"
confirm = "enter"
move_down = "j"
move_up = "k"
delete_char = "backspace"

[plugins]
enabled = []
