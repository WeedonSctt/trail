[package]
# Published to crates.io as `trail-fm`: the name `trail` there belongs to an
# unrelated library. The binary and the library are still `trail` (see [lib]
# and [[bin]] below), so `cargo install trail-fm` installs a `trail` command.
name = "trail-fm"
version = "1.11.2"
edition = "2021"
# Minimum Supported Rust Version.  Verified against the stable toolchain used
# in CI.  Bump only when a dependency or language feature requires it.
rust-version = "1.80"
description = "A terminal-first workspace for navigating, inspecting and acting on the filesystem"
license = "MIT"
repository = "https://github.com/WeedonSctt/trail"
homepage = "https://github.com/WeedonSctt/trail"
readme = "README.md"
keywords = ["file-manager", "terminal", "tui", "cli", "filesystem"]
categories = ["command-line-utilities", "filesystem"]
# Exclude packaging metadata and generated files from the crates.io tarball.
exclude = [
    "pkg/",
    "install.sh",
    "install.ps1",
    "uninstall.sh",
    "uninstall.ps1",
    "Cross.toml",
    ".github/",
    ".agents/",
    "docs/",
    "screenshots/",
    "CLAUDE.md",
]

# Integration tests in tests/ import from the library crate (trail::).
# The binary uses the same source tree; src/main.rs is the entry point.
[lib]
name = "trail"
path = "src/lib.rs"

[[bin]]
name = "trail"
path = "src/main.rs"


[dependencies]
# --- UI ---
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, which the
# preview's scroll limit uses to count the rows a wrapped line takes. It is the
# same word wrapper the pane draws with; a home-grown count would drift from it.
ratatui = { version = "0.28", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# --- Async runtime (worker pool) ---
tokio = { version = "1", features = ["full"] }

# --- Search Mode ---
nucleo = "0.5"

# --- Preview: text/syntax ---
syntect = { version = "5", default-features = false, features = ["default-fancy"] } # avoids libonig C dep
content_inspector = "0.2"   # binary vs. text detection, routes entries to the right PreviewProvider

# --- Preview: git ---
gix = { version = "0.87", features = ["status"] }  # pure Rust; status feature enables is_dirty()

# --- Preview: filesystem watching ---
notify = "6"

# --- Preview: images ---
image = "0.25"
# 2.x, not 1.x: 1.x asks for `ratatui >= 0.23`, so a resolve without Cargo.lock
# (`cargo install trail-fm`) picks ratatui 0.30 for it, and its widgets stop
# matching the 0.28 `Frame` they draw into. Every 2.x asks for `^0.28.1`; 3.x
# moves to 0.29, so do not let this float past 2.
ratatui-image = "2.0.1"

# --- Preview: binary/metadata formatting ---
chrono = { version = "0.4", features = ["clock"] }   # timestamps
humansize = "2"                                       # file sizes ("4.2 MB" instead of raw bytes)

# --- Plugin system ---
mlua = { version = "0.9", features = ["lua54", "vendored"] }  # bundles Lua, no system install needed

# --- Config ---
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Edits the user's trail.toml in place for `:config write`, keeping comments.
# Already in the graph through `toml`; this pins the same version as a direct
# dependency rather than adding a new one.
toml_edit = "0.22.27"

# --- CLI ---
clap = { version = "4", features = ["derive"] }

# --- Paths (config dir, cache dir) ---
directories = "5"

# --- Clipboard ---
arboard = "3"

# --- Delete ---
trash = "5"        # `dd` goes to the platform recycle bin; nothing in the stack can

# --- Terminal panel ---
portable-pty = "0.9"       # runs each panel shell in a pseudo-terminal (ConPTY on Windows)
vt100 = "0.16"             # turns a shell's output into a screen grid Trail draws itself
sysinfo = { version = "0.36", default-features = false, features = ["system"] }  # "is a shell busy?" asks whether it has child processes

# --- Error handling & logging ---
anyhow = "1"
thiserror = "1"             # typed errors for library-shaped modules (coding-standard §4)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"   # log to a file, since stdout/stderr belong to the TUI
futures = "0.3"            # StreamExt for crossterm EventStream in the async event loop

[dev-dependencies]
insta = "1"        # kept for a future whole-frame snapshot; render tests currently assert on buffer contents
tempfile = "3"     # scratch dirs/files for fixture-driven preview + fs_ops tests

[profile.dev]
opt-level = 1        # ratatui/crossterm feel noticeably laggy at opt-level 0

[profile.release]
lto = true
codegen-units = 1
strip = true          # smaller release binaries, relevant once Phase 9 packaging starts

